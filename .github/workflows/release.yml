name: Release

on:
  push:
    branches:
      - master
      - cat/v14-upgrade
    paths-ignore:
      - '.github/**'
      - '*.md'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    # Skip commits made by this workflow itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: version
        run: |
          CURRENT=$(jq -r '.version' system.json)
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "old=$CURRENT" >> $GITHUB_OUTPUT
          jq --arg v "$NEW" '.version = $v' system.json > system.json.tmp && mv system.json.tmp system.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add system.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }} [skip ci]"
          git push

      - name: Build system.zip
        run: |
          zip -r system.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude "*.lock" \
            --exclude "gulpfile.js" \
            --exclude "less/*" \
            --exclude "doc-images/*" \
            --exclude "packs/mighty-protectors-rolltables/*.ldb" \
            --exclude "packs/mighty-protectors-rolltables/LOG*" \
            --exclude "packs/mighty-protectors-rolltables/LOCK" \
            --exclude "packs/mighty-protectors-rolltables/CURRENT" \
            --exclude "packs/mighty-protectors-rolltables/MANIFEST*"

      - name: Delete existing release if present
        run: gh release delete v${{ steps.version.outputs.new }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create v${{ steps.version.outputs.new }} \
            system.json \
            system.zip \
            --title "v${{ steps.version.outputs.new }}" \
            --notes "Auto-release from commit: ${{ github.event.head_commit.message }}" \
            --target ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
